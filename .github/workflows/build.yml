name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            exe_ext: .exe
            archive_format: zip
            archive_ext: .zip
            target: desktop
            artifact_suffix: ""
            enable_gui: true
            cgo_enabled: "0"

          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            exe_ext: ""
            archive_format: zip
            archive_ext: .zip
            target: desktop
            artifact_suffix: ""
            enable_gui: true
            cgo_enabled: "0"

          - os: macos-14
            goos: darwin
            goarch: arm64
            exe_ext: ""
            archive_format: zip
            archive_ext: .zip
            target: desktop
            artifact_suffix: ""
            enable_gui: true
            cgo_enabled: "0"

          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            exe_ext: ""
            archive_format: tar.gz
            archive_ext: .tar.gz
            target: desktop
            artifact_suffix: ""
            enable_gui: true
            cgo_enabled: "0"

          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            exe_ext: ""
            archive_format: tar.gz
            archive_ext: .tar.gz
            target: desktop
            artifact_suffix: ""
            enable_gui: true
            cgo_enabled: "0"

          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            exe_ext: ""
            archive_format: tar.gz
            archive_ext: .tar.gz
            target: softrouter
            artifact_suffix: "-softrouter"
            enable_gui: false
            cgo_enabled: "0"

          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            exe_ext: ""
            archive_format: tar.gz
            archive_ext: .tar.gz
            target: softrouter
            artifact_suffix: "-softrouter"
            enable_gui: false
            cgo_enabled: "0"

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Initialize Go module
        run: |
          go mod init ech-workers || true
          go mod tidy

      - name: Build Go executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
        run: |
          echo "Building for $GOOS/$GOARCH (target=${{ matrix.target }}, CGO_ENABLED=$CGO_ENABLED)"
          go build -trimpath -ldflags="-s -w" -o ech-workers${{ matrix.exe_ext }} ech-workers.go
        shell: bash

      - name: Set up Python
        if: matrix.enable_gui == true
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: matrix.goos == 'linux' && matrix.enable_gui == true
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 python3-pyqt5.qtsvg python3-dev
        shell: bash

      - name: Install PyInstaller and dependencies
        if: matrix.enable_gui == true
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.goos }}" == "linux" ]; then
            pip install pyinstaller pystray Pillow PySocks
          else
            pip install pyinstaller PyQt5 pystray Pillow PySocks
          fi
        shell: bash

      - name: Build Python executable
        if: matrix.enable_gui == true
        run: |
          ICON_ARG=""
          if [ "${{ matrix.goos }}" == "windows" ]; then
            if [ -f "app_icon.ico" ]; then ICON_ARG="--icon=app_icon.ico"; fi
            pyinstaller --onefile --windowed --name ECHWorkersGUI --hidden-import=PyQt5 $ICON_ARG gui.py || true
          elif [ "${{ matrix.goos }}" == "linux" ]; then
            if [ -f "app_icon.png" ]; then ICON_ARG="--icon=app_icon.png"; fi
            pyinstaller --onefile --name ECHWorkersGUI --hidden-import=PyQt5 $ICON_ARG gui.py || true
          else
            if [ -f "app_icon.icns" ]; then ICON_ARG="--icon=app_icon.icns"; fi
            pyinstaller --onefile --name ECHWorkersGUI --hidden-import=PyQt5 $ICON_ARG gui.py || true
          fi
        shell: bash

      - name: Download China IP list
        run: |
          echo "Downloading latest China IP list..."
          curl -L -o chn_ip.txt "https://raw.githubusercontent.com/mayaxcn/china-ip-list/refs/heads/master/chn_ip.txt" || true
          curl -L -o chn_ip_v6.txt "https://raw.githubusercontent.com/mayaxcn/china-ip-list/refs/heads/master/chn_ip_v6.txt" || true
        shell: bash

      - name: Prepare release files
        run: |
          mkdir -p release
          cp ech-workers${{ matrix.exe_ext }} release/
          if [ -f "chn_ip.txt" ]; then cp chn_ip.txt release/; fi
          if [ -f "chn_ip_v6.txt" ]; then cp chn_ip_v6.txt release/; fi
          
          if [ "${{ matrix.enable_gui }}" = "true" ]; then
            if [ "${{ matrix.goos }}" == "windows" ] && [ -f "dist/ECHWorkersGUI.exe" ]; then
              cp dist/ECHWorkersGUI.exe release/
            elif [ -f "dist/ECHWorkersGUI" ]; then
              cp dist/ECHWorkersGUI release/
              chmod +x release/ECHWorkersGUI
            fi
          fi
        shell: bash

      - name: Create archive (Windows)
        if: matrix.goos == 'windows'
        run: |
          cd release
          powershell Compress-Archive -Path * -DestinationPath ../ECHWorkers-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.artifact_suffix }}${{ matrix.archive_ext }} -Force
        shell: powershell

      - name: Create archive (macOS/Linux)
        if: matrix.goos != 'windows'
        run: |
          cd release
          if [ "${{ matrix.archive_format }}" == "zip" ]; then
            zip -r ../ECHWorkers-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.artifact_suffix }}${{ matrix.archive_ext }} .
          else
            tar -czf ../ECHWorkers-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.artifact_suffix }}${{ matrix.archive_ext }} .
          fi
        shell: bash

      # 关键修改：每次 Push 都必定上传打包好的二进制文件到 Artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ECHWorkers-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.artifact_suffix }}
          path: ECHWorkers-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.artifact_suffix }}${{ matrix.archive_ext }}
          retention-days: 30

  # 如果打了 Tag，依然会自动生成 GitHub Release 页面发布
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
